<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج محاكاة المحافظة والمجالس المحلية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        gov: { 50: '#f0f9ff', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-step { display: none; }
        .form-step.active { display: block; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gradient-to-r from-gov-900 via-gov-800 to-gov-700 text-white shadow-xl">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-right">
                <div>
                    <span class="inline-block px-3 py-1 bg-white/10 rounded-full text-gold-400 text-xs font-semibold mb-2 border border-white/20">
                        <i class="fas fa-landmark text-xs"></i> منصة الكوادر الشبابية الرسمية
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-black">برنامج محاكاة المحافظة</h1>
                    <p class="text-gov-100 text-sm mt-1">بوابة التسجيل الإلكتروني واستعلام حالة الطلبات لعام 2026.</p>
                </div>
                <div class="bg-white/10 p-3 rounded-2xl border border-white/20 flex flex-col items-center justify-center w-20 h-20">
                    <i class="fas fa-shield-halved text-3xl text-gold-400"></i>
                    <span class="text-[9px] font-bold mt-1">محافظة الفيوم</span>
                </div>
            </div>

            <!-- Main Navigation Switcher -->
            <div class="flex gap-2 mt-6 pt-4 border-t border-white/10">
                <button id="nav-tab-reg" onclick="switchMainTab('reg')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-gov-900 shadow transition-all flex items-center gap-2 cursor-pointer">
                    <i class="fas fa-file-signature"></i> التسجيل للبرنامج
                </button>
                <button id="nav-tab-track" onclick="switchMainTab('track')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-white/10 text-white hover:bg-white/25 border border-white/20 transition-all flex items-center gap-2 cursor-pointer">
                    <i class="fas fa-search-dollar"></i> الاستعلام عن الطلب
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 py-8 w-full flex-grow">

        <!-- ================= TAB 1: REGISTRATION ================= -->
        <div id="tab-content-reg" class="tab-content active">
            
            <!-- Stepper Indicators -->
            <div id="stepperContainer" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
                <div class="flex items-center justify-between text-center relative">
                    <div class="flex flex-col items-center z-10">
                        <div id="step-ind-1" class="w-10 h-10 rounded-full bg-gov-600 text-white font-bold flex items-center justify-center shadow-md">1</div>
                        <span class="text-xs font-bold text-gov-800 mt-1">البيانات الشخصية</span>
                    </div>
                    <div class="flex-1 h-1 bg-gray-200 mx-2 relative">
                        <div id="progress-bar" class="absolute right-0 top-0 bottom-0 bg-gov-600 transition-all duration-300" style="width: 0%;"></div>
                    </div>
                    <div class="flex flex-col items-center z-10">
                        <div id="step-ind-2" class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 font-bold flex items-center justify-center">2</div>
                        <span class="text-xs font-semibold text-gray-400 mt-1">اختيار اللجنة</span>
                    </div>
                    <div class="flex-1 h-1 bg-gray-200 mx-2"></div>
                    <div class="flex flex-col items-center z-10">
                        <div id="step-ind-3" class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 font-bold flex items-center justify-center">3</div>
                        <span class="text-xs font-semibold text-gray-400 mt-1">الدافع والختام</span>
                    </div>
                </div>
            </div>

            <!-- Form Card Box -->
            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-8">
                <form id="simulationMasterForm" onsubmit="handleFormSubmission(event)">
                    
                    <!-- STEP 1 -->
                    <div id="form-step-1" class="form-step active space-y-5">
                        <div class="border-b pb-3 mb-4">
                            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                                <i class="fas fa-user-circle text-gov-600"></i> الخطوة الأولى: البيانات الأساسية
                            </h2>
                            <p class="text-xs text-gray-500">يرجى إدخال البيانات بدقة متناهية كما هي بالبطاقة الشخصية.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">الاسم الرباعي كاملاً <span class="text-red-500">*</span></label>
                            <input type="text" id="fullName" required placeholder="مثال: أحمد محمد علي حسن" class="w-full p-3 rounded-xl border border-gray-300 focus:border-gov-600 outline-none text-sm bg-white">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">الرقم القومي (14 رقم) <span class="text-red-500">*</span></label>
                                <input type="text" id="nationalId" maxlength="14" required placeholder="2040101XXXXXXXX" class="w-full p-3 rounded-xl border border-gray-300 focus:border-gov-600 outline-none text-sm bg-white" dir="ltr">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">تاريخ الميلاد <span class="text-red-500">*</span></label>
                                <div class="grid grid-cols-3 gap-2">
                                    <select id="bDay" required class="p-2.5 rounded-xl border border-gray-300 bg-white text-xs focus:border-gov-600 outline-none">
                                        <option value="" disabled selected>اليوم</option>
                                    </select>
                                    <select id="bMonth" required class="p-2.5 rounded-xl border border-gray-300 bg-white text-xs focus:border-gov-600 outline-none">
                                        <option value="" disabled selected>الشهر</option>
                                        <option value="01">يناير</option><option value="02">فبراير</option><option value="03">مارس</option>
                                        <option value="04">أبريل</option><option value="05">مايو</option><option value="06">يونيو</option>
                                        <option value="07">يوليو</option><option value="08">أغسطس</option><option value="09">سبتمبر</option>
                                        <option value="10">أكتوبر</option><option value="11">نوفمبر</option><option value="12">ديسمبر</option>
                                    </select>
                                    <select id="bYear" required class="p-2.5 rounded-xl border border-gray-300 bg-white text-xs focus:border-gov-600 outline-none">
                                        <option value="" disabled selected>السنة</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">رقم الهاتف المحمول <span class="text-red-500">*</span></label>
                                <input type="tel" id="phone" required placeholder="010XXXXXXXX" class="w-full p-3 rounded-xl border border-gray-300 focus:border-gov-600 outline-none text-sm bg-white" dir="ltr">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">البريد الإلكتروني <span class="text-red-500">*</span></label>
                                <input type="email" id="email" required placeholder="name@example.com" class="w-full p-3 rounded-xl border border-gray-300 focus:border-gov-600 outline-none text-sm bg-white" dir="ltr">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">الم
